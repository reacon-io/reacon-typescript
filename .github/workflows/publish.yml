name: SDK publication
run-name: SDK npm publication · ${{ inputs.release_id }} · ${{ inputs.attempt_id }}

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Qualified release ledger ID
        type: string
        required: true
      attempt_id:
        description: Coordinator's unique publication attempt ID
        type: string
        required: true
      ci_artifact_id:
        description: Retained native-package artifact in this repository
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: sdk-publication
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.11.0
      - name: Install pinned publisher tools
        run: |
          npm ci --prefix .github/sdk-release --ignore-scripts --no-audit --no-fund
          npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
          echo "REACON_NPM_CLI=$(npm root --global)/npm/bin/npm-cli.js" >> "$GITHUB_ENV"
      - name: Publish only the coordinator-authorized retained package
        env:
          REACON_RELEASE_ID: ${{ inputs.release_id }}
          REACON_ATTEMPT_ID: ${{ inputs.attempt_id }}
          REACON_CI_ARTIFACT_ID: ${{ inputs.ci_artifact_id }}
          REACON_GITHUB_APP_PRIVATE_KEY: ${{ secrets.REACON_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/sdk-release/publish-npm.mjs
      - name: Retain publication outcome for coordinator reconciliation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sdk-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: sdk-release-results/
          if-no-files-found: error
          retention-days: 30
